[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
 
[project]
name = "wcurse"
version = "0.1.0"
description = "Bias-corrected reporting for best-of-N selection over correlated candidate pools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anonymous" }]
dependencies = ["numpy>=1.24", "scipy>=1.10"]
 
[project.optional-dependencies]
analysis = ["pandas>=2.0", "matplotlib>=3.7", "tabulate>=0.9"]
dev = ["pytest>=7.4"]
 
[tool.setuptools.packages.find]
where = ["src"]
 
[tool.pytest.ini_options]
testpaths = ["tests"]
 
